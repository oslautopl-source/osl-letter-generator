    :root { --navy: #16265f; --red: #c8102e; --ink: #222; --muted: #596274; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; background: #f2f3f7; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    .container { max-width: 1080px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 0 0 18px; }
    h1 { color: var(--navy); font-size: clamp(22px, 3vw, 30px); margin: 0; }
    .back { display: inline-block; padding: 10px 14px; color: var(--navy); background: #fff; border: 1px solid #d4d9e5; border-radius: 8px; font-weight: 700; text-decoration: none; }
    .form-box { padding: 22px; margin-bottom: 24px; background: #fff; border-radius: 10px; box-shadow: 0 3px 18px #17264c12; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px 18px; }
    label { display: block; color: #333; font-size: 14px; font-weight: 700; }
    input { display: block; width: 100%; margin-top: 6px; padding: 10px 11px; border: 1px solid #c9ced8; border-radius: 6px; background: #fff; font: inherit; font-size: 14px; }
    input:focus { outline: 2px solid #b9c8ff; border-color: #6b82cf; }
    .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
    button { border: 0; border-radius: 6px; padding: 12px 24px; color: #fff; background: var(--red); font-size: 15px; font-weight: 700; cursor: pointer; }
    .status { min-height: 20px; margin-top: 14px; text-align: center; font-size: 13px; font-weight: 700; }
    .status.success { color: #18732b; } .status.error { color: #c8102e; }
    .preview-heading { margin: 24px 0 12px; color: var(--navy); font-size: 20px; }
    #chequeCanvas { width: 100%; max-width: 900px; height: auto; display: block; margin: 0 auto; background: #fff; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 2px 18px #00000020; }
    @media (max-width: 700px) { body { padding: 12px; } .form-box { padding: 16px; } .form-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="container">
    <header class="topbar">
      <h1>Bank Cheque</h1>
      <a class="back" href="index.html">&#8592; Back to Home</a>
    </header>

    <section class="form-box" aria-label="Bank cheque form">
      <div class="form-grid">
        <label for="amount">Amount (Rs.)
          <input id="amount" type="text" inputmode="decimal" placeholder="150000" autocomplete="off">
        </label>
        <label for="chequeNo">Cheque Number
          <input id="chequeNo" type="text" inputmode="numeric" maxlength="6" placeholder="035376" autocomplete="off">
        </label>
      </div>
      <div class="btn-row">
        <button id="chequeDownload" type="button">Download Cheque (JPG)</button>
      </div>
      <div id="chequeStatus" class="status" role="status" aria-live="polite"></div>
    </section>

    <h2 class="preview-heading">Cheque Preview</h2>
    <canvas id="chequeCanvas"></canvas>
  </main>

<script>
(() => {
  /* ---------- CONFIG: sudhu eikhane change korben ---------- */
  const CFG = {
    amountInput:   '#amount',          // apnar Amount input-er id
    chequeNoInput: '#chequeNo',        // apnar Cheque No input-er id
    canvas:        '#chequeCanvas',
    downloadBtn:   '#chequeDownload',
    status:        '#chequeStatus',
    chequeSrc:     'cheque.jpg',       // CLEAN cheque photo (lal/sobuj box charao)
    refW: 1802, refH: 873,             // je photo theke box coordinate nilam tar size
    red:   { x: 691, y: 431, w: 505, h: 33 },   // Not Above amount box
    green: { x: 459, y: 764, w: 172, h: 29 },   // Cheque Number box
    handFont: 'Caveat',
    micrFont: 'MICR',
    inkColor:  '#1b2a6b',              // ballpoint neel; kalo chaile '#111'
    micrColor: '#111111',
    micrScale: 1.5,                    // MICR digit boro/choto korte
    prefix: 'Not Above ',
    debugBoxes: false                  // true korle box-er outline dekhabe (calibration)
  };

  const $ = s => document.querySelector(s);
  const cv = $(CFG.canvas), ctx = cv.getContext('2d');
  const img = new Image();
  let ready = false;
  const statusEl = $(CFG.status);
  const setStatus = (msg, kind) => { if (statusEl) { statusEl.textContent = msg || ''; statusEl.className = 'status ' + (kind || ''); } };

  /* seeded random: same input = same handwriting, refresh-e bodlabe na */
  const seedFrom = s => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const mulberry32 = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  const fmtINR = raw => {
    const n = parseFloat(String(raw).replace(/[^0-9.]/g, ''));
    if (!isFinite(n)) return '';
    return new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
  };

  function drawHand(text, b, kx, ky) {
    if (!text) return;
    const bx = b.x * kx, by = b.y * ky, bw = b.w * kx, bh = b.h * ky;
    const rnd = mulberry32(seedFrom(text));
    let size = bh * 1.15;
    const setFont = s => { ctx.font = `500 ${s}px ${CFG.handFont}, cursive`; };
    const textW = s => { setFont(s); return [...text].reduce((w, c) => w + ctx.measureText(c).width + s * 0.02, 0); };
    const w = textW(size);
    if (w > bw * 0.95) size *= (bw * 0.95) / w;      // box-e na dhukle auto-shrink
    setFont(size);

    let x = bx + 4 * kx;
    const baseline = by + bh * 0.78;
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';       // paper-er chaya lekhar opor dekha jabe
    ctx.fillStyle = CFG.inkColor;
    ctx.globalAlpha = 0.92;
    ctx.shadowColor = CFG.inkColor;
    ctx.shadowBlur = size * 0.03;                    // halka ink bleed
    for (const ch of text) {
      const cw = ctx.measureText(ch).width;
      const jy  = (rnd() - 0.5) * size * 0.10;       // upor-niche
      const rot = (rnd() - 0.5) * 0.07 - 0.012;      // halka tilt
      const sc  = 1 + (rnd() - 0.5) * 0.08;          // size variation
      const rise = ((x - bx) / bw) * size * 0.04;    // line dhire dhire upore uthbe
      ctx.save();
      ctx.translate(x + cw / 2, baseline + jy - rise);
      ctx.rotate(rot);
      ctx.scale(sc, sc);
      ctx.fillText(ch, -cw / 2, 0);
      ctx.restore();
      x += cw + size * 0.02 + (rnd() - 0.5) * size * 0.03;
    }
    ctx.restore();
  }

  function drawMicr(no, b, kx, ky) {
    if (!no) return;
    const digits = no.padStart(6, '0').slice(-6);    // 6 digit
    const cell = (b.w * kx) / 6;
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = CFG.micrColor;
    ctx.font = `${b.h * ky * 1.1 * CFG.micrScale}px ${CFG.micrFont}, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    [...digits].forEach((d, i) => ctx.fillText(d, b.x * kx + cell * (i + 0.5), b.y * ky + b.h * ky * 0.95));
    ctx.restore();
  }

  function render() {
    if (!ready) return;
    const W = img.naturalWidth, H = img.naturalHeight;
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    const kx = W / CFG.refW, ky = H / CFG.refH;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);

    const amt = fmtINR($(CFG.amountInput).value);
    drawHand(amt ? CFG.prefix + amt : '', CFG.red, kx, ky);

    const no = ($(CFG.chequeNoInput).value || '').replace(/\D/g, '');
    drawMicr(no, CFG.green, kx, ky);

    if (CFG.debugBoxes) {
      ctx.save(); ctx.lineWidth = 2;
      ctx.strokeStyle = 'red';   ctx.strokeRect(CFG.red.x * kx, CFG.red.y * ky, CFG.red.w * kx, CFG.red.h * ky);
      ctx.strokeStyle = 'green'; ctx.strokeRect(CFG.green.x * kx, CFG.green.y * ky, CFG.green.w * kx, CFG.green.h * ky);
      ctx.restore();
    }
  }

  let raf = 0;
  const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };
  [CFG.amountInput, CFG.chequeNoInput].forEach(sel => {
    const el = $(sel);
    if (el) ['input', 'change'].forEach(ev => el.addEventListener(ev, schedule));
  });

  $(CFG.downloadBtn).addEventListener('click', () => {
    if (!ready) { setStatus('Cheque image (cheque.jpg) load hoy ni. File ta HTML er pashe rakhun.', 'error'); return; }
    if (!$(CFG.amountInput).value.trim() || !$(CFG.chequeNoInput).value.trim()) {
      setStatus('Age Amount ar Cheque Number duto-i likhun.', 'error'); return;
    }
    try {
      cv.toBlob(blob => {
        if (!blob) { setStatus('JPG toiri kora jayni.', 'error'); return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'cheque-' + (($(CFG.chequeNoInput).value || 'preview').replace(/\D/g, '') || 'preview') + '.jpg';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        setStatus('Cheque JPG download hoyeche.', 'success');
      }, 'image/jpeg', 0.95);
    } catch (e) {
      setStatus('Download hocche na: file:// theke na khule hosting/local server (http) diye kholen.', 'error');
    }
  });

  /* Credit Request page theke ashle: bank-cheque.html?amount=35000000.00&chequeNo=100491 */
  (function prefillFromUrl() {
    const qs = new URLSearchParams(location.search);
    const amt = qs.get('amount'), no = qs.get('chequeNo');
    if (amt) $(CFG.amountInput).value = amt;
    if (no) $(CFG.chequeNoInput).value = no.replace(/\D/g, '').slice(-6);
    if (amt || no) setStatus('Credit Request form theke Amount ar Cheque Number auto-fill hoyeche.', 'success');
  })();

  (async function init() {
    try {
      await Promise.all([
        document.fonts.load(`500 40px ${CFG.handFont}`),
        document.fonts.load(`40px ${CFG.micrFont}`)
      ]);
    } catch (e) { console.warn('Font load issue:', e); }
    img.onload = () => { ready = true; render(); };
    img.onerror = () => setStatus('cheque.jpg paoya jayni. Clean cheque photo ta "cheque.jpg" naame ei HTML er pashe rakhun.', 'error');
    img.src = CFG.chequeSrc;
  })();

  // apnar form-er onno JS theke value set korle eta call korun: renderCheque()
  window.renderCheque = render;
})();
</script>
</body>
</html>
